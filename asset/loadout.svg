<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Technical Loadout">
  <style>
    text { font-family: 'JetBrains Mono', 'Cascadia Code', 'CaskaydiaCove Nerd Font', Consolas, Menlo, monospace; }
  </style>
  <defs>
    <clipPath id="clip">
      <rect x="0" y="0" width="800" height="600" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <!-- window bg -->
  <rect x="0.5" y="0.5" width="799" height="599" rx="12" fill="#1a1b26" stroke="#2f354d" stroke-width="1"/>
  <!-- titlebar -->
  <rect x="0" y="0" width="800" height="42" fill="#16161e"/>
  <line x1="0" y1="42.5" x2="800" y2="42.5" stroke="#2f354d" stroke-width="1"/>
  <circle cx="28" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="21" r="6" fill="#27c93f"/>
  <text x="400" y="26" text-anchor="middle" font-size="13" fill="#565f89">yozora@hoshimiya: ~/technical_loadout.sh</text>

  <!-- body -->
  <g font-size="13.5" clip-path="url(#clip)">
    <!-- cmd -->
    <text x="32" y="72"><tspan fill="#7aa2f7">$</tspan><tspan fill="#c0caf5"> cat technical_loadout.sh</tspan><tspan fill="#565f89"> —</tspan></text>

    <!-- section 1 -->
    <text x="32" y="104" font-weight="bold"><tspan fill="#7aa2f7">▼ Hardware &amp; Silicon Engineering</tspan></text>
    <text x="32" y="126"><tspan fill="#565f89">-</tspan><tspan fill="#7dcfff"> Domain: </tspan><tspan fill="#c0caf5">ASIC &amp; FPGA Architecture, RTL Design</tspan></text>
    <text x="32" y="148"><tspan fill="#565f89">-</tspan><tspan fill="#7dcfff"> Hardware: </tspan><tspan fill="#c0caf5">Verilog, SystemVerilog, Digital Logic Synthesis</tspan></text>
    <text x="32" y="170"><tspan fill="#565f89">-</tspan><tspan fill="#7dcfff"> Institute: </tspan><tspan fill="#c0caf5">Industrial University of Ho Chi Minh City (IUH)</tspan></text>

    <!-- section 2 -->
    <text x="32" y="202" font-weight="bold"><tspan fill="#bb9af7">▼ Frontier LLM Jailbreak Research</tspan><tspan fill="#1a1b26">..</tspan><tspan font-size="11" font-weight="normal" fill="#1a1b26" stroke="#9ece6a" stroke-width="0"><tspan fill="#9ece6a" stroke="none"> ● CORE FOCUS</tspan></tspan></text>

    <!-- 2-col grid -->
    <g>
      <text x="48" y="226"><tspan fill="#9ece6a">• </tspan><tspan fill="#e0af68">OpenAI: </tspan><tspan fill="#c0caf5">All models up to GPT-6</tspan></text>
      <text x="410" y="226"><tspan fill="#9ece6a">• </tspan><tspan fill="#e0af68">Meta: </tspan><tspan fill="#c0caf5">Llama 70B</tspan></text>

      <text x="48" y="248"><tspan fill="#9ece6a">• </tspan><tspan fill="#e0af68">Anthropic: </tspan><tspan fill="#c0caf5">Claude 4.0, 4.1, 4.5, 5.0</tspan></text>
      <text x="410" y="248"><tspan fill="#9ece6a">• </tspan><tspan fill="#e0af68">Alibaba: </tspan><tspan fill="#c0caf5">Qwen 3.8</tspan></text>

      <text x="48" y="270"><tspan fill="#9ece6a">• </tspan><tspan fill="#e0af68">Google: </tspan><tspan fill="#c0caf5">Gemini 3.1 Pro, 3.5-3.8 Flash</tspan></text>
      <text x="410" y="270"><tspan fill="#9ece6a">• </tspan><tspan fill="#e0af68">Zhipu: </tspan><tspan fill="#c0caf5">GLM 5.3</tspan></text>

      <text x="48" y="292"><tspan fill="#9ece6a">• </tspan><tspan fill="#e0af68">DeepSeek: </tspan><tspan fill="#c0caf5">V4, V4.1</tspan></text>
      <text x="410" y="292"><tspan fill="#9ece6a">• </tspan><tspan fill="#e0af68">Moonshot: </tspan><tspan fill="#c0caf5">Kimi k3</tspan></text>

      <text x="48" y="314"><tspan fill="#9ece6a">• </tspan><tspan fill="#e0af68">xAI: </tspan><tspan fill="#c0caf5">Grok 4.3</tspan></text>
      <text x="410" y="314"><tspan fill="#9ece6a">• </tspan><tspan fill="#e0af68">Tencent: </tspan><tspan fill="#c0caf5">Hunyuan 3 (HY3), HY4</tspan></text>
    </g>

    <text x="32" y="344"><tspan fill="#565f89">-</tspan><tspan fill="#7dcfff"> Focus: </tspan><tspan fill="#c0caf5">RLHF / DPO bypass, refusal-vector study, CoT suppression,</tspan></text>
    <text x="48" y="366"><tspan fill="#9aa5ce">multi-turn framing &amp; adaptive payload research</tspan></text>
    <text x="32" y="388"><tspan fill="#565f89">-</tspan><tspan fill="#7dcfff"> Staging: </tspan><tspan fill="#c0caf5">LLM director for SDXL prompt engineering &amp; scene geometry</tspan></text>
    <text x="32" y="410"><tspan fill="#565f89">-</tspan><tspan fill="#7dcfff"> Safety: </tspan><tspan fill="#c0caf5">Alignment robustness analysis (Claude / GPT)</tspan></text>

    <!-- section 3 -->
    <text x="32" y="442" font-weight="bold"><tspan fill="#7dcfff">▼ Native Systems &amp; Mobile Architecture</tspan></text>
    <text x="32" y="464"><tspan fill="#565f89">-</tspan><tspan fill="#7dcfff"> Systems: </tspan><tspan fill="#c0caf5">Pure Rust, Win32 API (EmptyWorkingSet), Ratatui TUI, egui</tspan></text>
    <text x="32" y="486"><tspan fill="#565f89">-</tspan><tspan fill="#7dcfff"> Android: </tspan><tspan fill="#c0caf5">Kotlin, Compose, Room SQLite, Coroutines, Java 17</tspan></text>
    <text x="32" y="508"><tspan fill="#565f89">-</tspan><tspan fill="#7dcfff"> Extend: </tspan><tspan fill="#c0caf5">Model Context Protocol (MCP) Server Architecture</tspan></text>

    <!-- prompt -->
    <text x="32" y="548"><tspan fill="#7aa2f7">$</tspan><tspan fill="#c0caf5"> </tspan><rect x="44" y="537" width="9" height="16" fill="#c0caf5"><animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.45;0.55;1" dur="1.1s" repeatCount="indefinite"/></rect></text>
  </g>
</svg>
